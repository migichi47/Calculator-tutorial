<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <h1 class="title">My Calculator</h1>
    <form>
      <label for="">
        <span>Enter first number</span>
        <input id="first-input" type="text" />
      </label>
      <br />
      <label for="">
        <span>Enter second number</span>
        <input id="second-input" type="text" />
      </label>
      <label for="" class="dropdown-container">
        <span>Choose operation</span>
        <select name="" class="dropdown">
          <option value="add">Add</option>
          <option value="subtract">Subtract</option>
          <option value="multiply">Multiply</option>
          <option value="divide">Divide</option>
        </select></label
      >
    </form>
    <button id="button">Work out</button>
    <span id="output">output</span>
    <script src="./index.js"></script>
  </body>
</html>
